<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bill</title>
</head>
<body>
    <table border ="1" cellpadding="8" cellspacing="0" align="center">
         <tr>
            <td>
                <center><h1>Shopping Bill</h1></center>
            <table border="1" cellpadding="6" cellspacing="0" align="center">
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price (₹)</th>
                <th>Amount (₹)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>2</td>
                <td>50</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Pen</td>
                <td>5</td>
                <td>10</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Book</td>
                <td>1</td>
                <td>200</td>
                <td>200</td>
            </tr>
            <tr>
                <td>Bag</td>
                <td>1</td>
                <td>500</td>
                <td>500</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total</td>
                <td>850</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
